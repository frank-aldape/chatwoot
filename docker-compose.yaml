x-base: &base
    image: ghcr.io/frank-aldape/chatwoot:prod
    env_file: .env
    volumes:
      - app_storage:/app/storage
    networks:
      - chatwoot_network

services:

  rails:
    <<: *base
    depends_on:
      - redis
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
    command: sh -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
    command: bundle exec sidekiq -C config/sidekiq.yml
    restart: always
    networks:
      - chatwoot_network

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - chatwoot_network

volumes:
  redis_data:
    external: true
    name: chatwoot_redis_data
  app_storage:
    external: true
    name: chatwoot_storage_data

networks:
  chatwoot_network:
    external: true
