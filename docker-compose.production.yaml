x-base: &base
    image: ${CHATWOOT_IMAGE:?Set CHATWOOT_IMAGE to an immutable tag or digest, e.g. ghcr.io/frank-aldape/chatwoot@sha256:...}
    env_file: .env
    volumes:
      - app_storage:/app/storage
    networks:
      - chatwoot_network

services:

  rails:
    <<: *base
    depends_on:
      - redis
    ports:
      - '3005:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY:-25}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    extra_hosts:
      - 'mail.mastercode.com.mx:host-gateway'
      - 'chat.mastercode.com.mx:host-gateway'

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - chatwoot_network

networks:
  chatwoot_network:
    external: true

volumes:
  app_storage:
    external: true
    name: chatwoot_storage_data
  redis_data:
    external: true
    name: chatwoot_redis_data
