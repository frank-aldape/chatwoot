# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# internal_check_new_versions_job intentionally disabled.
# It pinged Chatwoot Hub daily, overwrote INSTALLATION_PRICING_PLAN with the
# hub-reported plan, and ran Internal::ReconcilePlanConfigService which force-
# disables premium features on the community plan. Removing it keeps the locally
# set pricing plan and enabled features stable. Trade-off: no "new version
# available" notice (deploys are driven by CI) and no hub telemetry.
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed At every 5th minute..
trigger_imap_email_inboxes_job:
  cron: '*/5 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

#executed daily at 0430 UTC
# which will be IST 10:00 AM
process_stale_contacts_job:
  cron: '30 04 * * *'
  class: 'Internal::ProcessStaleContactsJob'
  queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 15 minutes
# to assign unassigned conversations for all inboxes
bulk_auto_assignment_job:
  cron: '*/15 * * * *'
  class: 'Inboxes::BulkAutoAssignmentJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 0300 UTC
# which is our lowest traffic time
# purges unattached ActiveStorage blobs older than 48h to prevent orphaned
# file storage growth
purge_orphaned_active_storage_blobs_job:
  cron: '0 3 * * *'
  class: 'Internal::PurgeOrphanedActiveStorageBlobsJob'
  queue: housekeeping

# executed every 5 minutes
# runs the production health checks (db pool, sidekiq queues, redis, disks) and
# posts to ALERT_WEBHOOK_URL when a threshold is crossed. Scheduling it here
# instead of a host cron means it ships with the image and survives rebuilds.
production_alerts_check_job:
  cron: '*/5 * * * *'
  class: 'Internal::ProductionAlertsCheckJob'
  queue: scheduled_jobs

# executed weekly on Mondays at 0700 UTC
# reports inboxes no team can see and roster drift, so access gaps surface
# without anyone remembering to run the rake task
inbox_access_drift_report_job:
  cron: '0 7 * * 1'
  class: 'Internal::InboxAccessDriftReportJob'
  queue: housekeeping
