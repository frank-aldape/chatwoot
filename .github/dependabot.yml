# Closes the loop left open by security_audit.yml: that workflow reports
# vulnerable dependencies, this one opens the PRs that fix them.
#
# Updates are grouped and monthly on purpose. This is a fork that tracks
# upstream Chatwoot, so a flood of individual bumps would cause merge conflicts
# faster than anyone can review them. Security updates are not grouped, so they
# arrive as soon as they are published.
version: 2

updates:
  - package-ecosystem: bundler
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      ruby-minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Rails major/minor moves are tracked as a planned upgrade in
      # docs/OPERATIONAL_RISKS.md, not as an automated bump.
      - dependency-name: rails
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      js-minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: '/docker'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
