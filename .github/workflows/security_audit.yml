name: Security Audit

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

jobs:
  ruby-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Bundler audit
        run: bundle exec bundler-audit check --update

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
